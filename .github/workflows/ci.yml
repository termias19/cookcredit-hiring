name: Verify hiring release
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: cookcredit_test
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: cookcredit_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U cookcredit_test" --health-interval 5s
          --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt pytest==9.0.3 PyYAML==6.0.2
      - name: Install decoder used by the isolated compression job
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Migrations and regression tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://cookcredit_test:isolated-test-only@127.0.0.1:5432/cookcredit_test
          HIRING_TEST_DATABASE_URL: postgresql://cookcredit_test:isolated-test-only@127.0.0.1:5432/cookcredit_test
        run: |
          python migrations/run_migrations.py
          python -m pytest tests ../deploy/tests -q -p no:cacheprovider
      - name: Audit installed dependency advisories
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --vulnerability-service pypi --strict
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: node --test tests/*.test.mjs
        working-directory: frontend
      - name: Build Hiring frontend and pinned assessment
        # Build-only identifiers cannot sign in. No production secrets or deploy
        # credentials enter CI; this bundle must never be promoted to Hosting.
        env:
          VITE_DEPLOYMENT_ENVIRONMENT: production
          VITE_PREVIEW: '0'
          VITE_API_URL: https://cookcredit-hiring-915097816203.us-central1.run.app
          VITE_AUTH_EMAIL_CONTINUE_URL: https://hiring.cookcredit.com/login
          VITE_ASSESSMENT_SAME_ORIGIN: '1'
          VITE_FIREBASE_PROJECT_ID: foodnlit-1123e
          VITE_FIREBASE_API_KEY: ci-build-only-not-a-credential
          VITE_FIREBASE_APP_ID: ci-build-only-not-a-credential
          VITE_FIREBASE_AUTH_DOMAIN: cookcredit.com
          VITE_HIRING_AUTH_DOMAIN: cookcredit.com
          VITE_RECAPTCHA_ENTERPRISE_SITE_KEY: ci-build-only-not-a-credential
        run: npm run build
        working-directory: frontend
      - name: Build isolated Home frontend
        run: npm run build:home
        working-directory: frontend
      - name: Audit production frontend dependencies
        run: npm audit --omit=dev --audit-level=low
        working-directory: frontend
      - name: Audit build tooling for moderate and higher advisories
        run: npm audit --audit-level=moderate
        working-directory: frontend
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --config /repo/.gitleaks.toml --redact --no-banner
